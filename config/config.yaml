# ri_a1 configuration

# Master seed. Launch: random spawn layout (negative = random each run).
# Controller: each robot seeds noise with (seed + robot index).
# Override at launch:  ros2 launch ri_a1 launch.py random_seed:=45
seed: 18

# Gaussian noise on wheel speeds (rad/s).
noise:
  noise: true
  strength: 0.2

# Random non-overlapping spawn area.
spawn:
  spawn_zone_x_min: -1.0
  spawn_zone_x_max:  1.0
  spawn_zone_y_min: -1.0
  spawn_zone_y_max:  1.0
  min_robot_distance: 0.5
  max_placement_attempts: 1000

# Default behaviour for every robot.
robot:
  # Obstacle detection
  seuil: 50          # sensor threshold (0-1024); below = nothing seen
  dist_stop: 0.05    # <= this (m): spin in place (-1.5 / +1.5 rad/s)
  dist_slow: 0.25    # below this (m): slow down linearly; beyond: max_speed

  # Speeds
  max_speed: 15.0         # per-wheel cap (rad/s)
  min_speed: 1.0         # floor while slowing (never below 0.3 * min_speed)
  turn_gain: 1.5         # wheel diff = turn_gain * turn * speed
  reverse_turn: false    # invert avoidance steering

  # Free-path cruising: L = cruise_speed*(1+c), R = cruise_speed*(1-c), capped
  cruise_speed: 3.75
  cruise_curvature: 0.0667   # >0 right, <0 left, 0 straight

  # Distance sensors
  sensor_angles_deg: [-50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50]

  # Calibration: [distance m, raw reading], linearly interpolated.
  lookup:
    - [0.0,  1024]
    - [0.05, 1000]
    - [0.5,  800]
    - [1.0,  600]
    - [2.0,  300]
    - [3.0,  120]
    - [4.0,  0]

# Per-robot overrides (unlisted keys keep `robot:` defaults).
robots:
  robot_0: { cruise_speed: 10.0, cruise_curvature: 0.05  }
  robot_1: { cruise_speed:  8.0, cruise_curvature: 0.06   }
  robot_2: { cruise_speed:  6.0, cruise_curvature: 0.07  }
  robot_3: { cruise_speed:  4.0, cruise_curvature: -0.05  }
  robot_4: { cruise_speed:  2.0, cruise_curvature: -0.06 }