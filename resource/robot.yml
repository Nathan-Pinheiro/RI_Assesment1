# Apply the controller-manager parameters to each namespaced robot.
/**:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# The controller-specific parameters are read by the controller manager when
# diffdrive_controller is spawned.
/**/diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["left wheel motor"]
    right_wheel_names: ["right wheel motor"]
    wheel_separation: 0.052
    wheel_radius: 0.02
    wheel_separation_multiplier: 1.095
    use_stamped_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true
    publish_rate: 50.0